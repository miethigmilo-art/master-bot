<!DOCTYPE html>
<html lang="en" data-vibe="fintech" data-mode="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Master Bot Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<style>
:root{--bg:#0a0d12;--bg-elev:#0f1419;--bg-elev2:#141a22;--panel:#0f1419;--line:rgba(255,255,255,0.06);--line-strong:rgba(255,255,255,0.12);--text:#e6e9ef;--text-dim:#8b94a3;--text-faint:#5a6373;--accent:#22d3ee;--pos:#22c55e;--neg:#ef4444;--warn:#f59e0b;--grid:rgba(255,255,255,0.04);--sidebar-w:228px;--radius:10px;--radius-sm:6px;--pad:20px;--font-mono:'JetBrains Mono','IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--font-sans:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--font-display:'Inter',ui-sans-serif,system-ui,sans-serif;--shadow-card:0 1px 0 rgba(255,255,255,0.02) inset,0 1px 2px rgba(0,0,0,0.4);--card-bg:var(--bg-elev)}
:root[data-mode="light"]{--bg:#f7f8fa;--bg-elev:#ffffff;--bg-elev2:#fbfbfd;--panel:#ffffff;--line:rgba(10,14,22,0.06);--line-strong:rgba(10,14,22,0.12);--text:#0f172a;--text-dim:#64748b;--text-faint:#94a3b8;--grid:rgba(10,14,22,0.04);--shadow-card:0 1px 2px rgba(15,23,42,0.04),0 0 0 1px rgba(15,23,42,0.04);--card-bg:#ffffff}
:root[data-vibe="terminal"]{--radius:0;--radius-sm:0;--font-sans:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;--font-display:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;--shadow-card:none;--card-bg:transparent}
:root[data-vibe="terminal"][data-mode="dark"]{--bg:#050200;--bg-elev:#080500;--bg-elev2:#0d0900;--panel:#080500;--line:rgba(255,176,32,0.22);--line-strong:rgba(255,176,32,0.55);--text:#ffb020;--text-dim:#cf8a14;--text-faint:#7a5108;--accent:#ff9000;--pos:#b6ff5b;--neg:#ff3838;--warn:#ffd84d;--grid:rgba(255,176,32,0.10)}
:root[data-vibe="cyber"][data-mode="dark"]{--bg:#07050d;--bg-elev:#0d0820;--bg-elev2:#15102c;--panel:#0d0820;--line:rgba(217,70,239,0.18);--line-strong:rgba(217,70,239,0.45);--text:#f5f3ff;--text-dim:#a78bfa;--text-faint:#6d28d9;--accent:#ec4899;--pos:#14f195;--neg:#ff2d55;--warn:#fde047;--grid:rgba(217,70,239,0.06);--shadow-card:0 0 0 1px rgba(217,70,239,0.18),0 0 24px rgba(217,70,239,0.06);--card-bg:linear-gradient(180deg,rgba(217,70,239,0.04),rgba(34,211,238,0.02))}
:root[data-vibe="mono"][data-mode="dark"]{--bg:#000000;--bg-elev:#0a0a0a;--bg-elev2:#111111;--panel:#0a0a0a;--line:rgba(255,255,255,0.1);--line-strong:rgba(255,255,255,0.22);--text:#ffffff;--text-dim:#999999;--text-faint:#555555;--accent:#ffffff;--pos:#ffffff;--neg:#888888;--warn:#ffffff;--grid:rgba(255,255,255,0.05);--shadow-card:none;--card-bg:var(--bg-elev)}
:root[data-vibe="fintech"][data-mode="dark"]{--bg:#0a0d12;--bg-elev:#11161e;--bg-elev2:#161c26;--panel:#11161e;--line:rgba(255,255,255,0.06);--line-strong:rgba(255,255,255,0.14);--text:#f1f5f9;--text-dim:#94a3b8;--text-faint:#64748b;--accent:#6366f1;--pos:#22c55e;--neg:#ef4444;--shadow-card:0 1px 0 rgba(255,255,255,0.02) inset,0 1px 2px rgba(0,0,0,0.4)}
:root[data-vibe="fintech"][data-mode="light"]{--bg:#f6f7fb;--bg-elev:#ffffff;--bg-elev2:#f9fafc;--panel:#ffffff;--line:rgba(15,23,42,0.06);--line-strong:rgba(15,23,42,0.14);--text:#0f172a;--text-dim:#475569;--text-faint:#94a3b8;--accent:#4f46e5;--pos:#16a34a;--neg:#dc2626}
:root[data-density="compact"]{--pad:14px}:root[data-density="comfy"]{--pad:26px}
*{box-sizing:border-box}html,body,#root{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:13px;line-height:1.45;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
:root[data-vibe="terminal"] body{font-family:var(--font-mono);font-size:12px;letter-spacing:0}
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh;background:var(--bg)}
.sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow-y:auto}
.main{overflow-y:auto;overflow-x:hidden}
.main-inner{padding:var(--pad);display:flex;flex-direction:column;gap:var(--pad);max-width:1600px;margin:0 auto}
.sb-brand{display:flex;align-items:center;gap:10px;padding:8px 10px 18px}
.sb-logo{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--bg);font-weight:700;font-size:14px;flex-shrink:0}
:root[data-vibe="terminal"] .sb-logo{border-radius:0}
.sb-brand-name{font-weight:600;font-size:14px;letter-spacing:-.02em}
.sb-brand-sub{font-size:10px;color:var(--text-faint);letter-spacing:.04em;text-transform:uppercase}
.sb-section-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);padding:14px 12px 4px}
.sb-nav{display:flex;flex-direction:column;gap:1px}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);color:var(--text-dim);cursor:pointer;font-size:13px;font-weight:500;transition:background .1s,color .1s;position:relative;white-space:nowrap;min-width:0;appearance:none;border:0;width:100%;text-align:left;font-family:inherit;background:transparent}
.sb-item>span:not(.sb-item-badge){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sb-item:hover{color:var(--text);background:var(--bg-elev2)}
.sb-item.active{color:var(--text);background:var(--bg-elev2)}
:root[data-vibe="terminal"] .sb-item.active{background:transparent;border-left:2px solid var(--accent);padding-left:8px;color:var(--accent)}
.sb-item svg{width:16px;height:16px;opacity:.9;flex-shrink:0}
.sb-item-badge{margin-left:auto;background:var(--accent);color:var(--bg);font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;letter-spacing:0}
.sb-foot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--line)}
.sb-bot-status{display:flex;align-items:center;gap:8px;font-size:11px;margin-bottom:6px}
.sb-bot-dot{width:8px;height:8px;border-radius:50%;background:var(--pos);position:relative;flex-shrink:0}
.sb-bot-dot.off{background:var(--text-faint)}
.sb-bot-dot.warn{background:var(--warn)}
.sb-bot-dot::after{content:'';position:absolute;inset:-3px;border-radius:50%;background:var(--pos);opacity:.3;animation:pulse 2s ease-out infinite}
.sb-bot-dot.off::after,.sb-bot-dot.warn::after{display:none}
@keyframes pulse{0%{transform:scale(1);opacity:.4}100%{transform:scale(2.4);opacity:0}}
.sb-bot-status-text{color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-bot-meta{font-size:10px;color:var(--text-faint);padding-left:16px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.topbar>div:first-child{min-width:0;flex:1 1 auto}
.topbar h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em;font-family:var(--font-display)}
:root[data-vibe="terminal"] .topbar h1{font-weight:700;text-transform:uppercase}
.topbar-sub{color:var(--text-dim);font-size:12px;margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap}
.tb-time{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.tb-btn{height:32px;padding:0 12px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--bg-elev);color:var(--text);font:inherit;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:background .1s,border-color .1s;white-space:nowrap;flex-shrink:0}
.tb-btn:hover{background:var(--bg-elev2);border-color:var(--line-strong)}
.tb-btn:disabled{opacity:.4;cursor:not-allowed}
.tb-btn svg{width:14px;height:14px}
:root[data-vibe="terminal"] .tb-btn{border-radius:0;text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card-bg);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-card)}
:root[data-vibe="terminal"] .card{border-color:var(--line);padding:10px 12px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-title{font-size:12px;font-weight:600;color:var(--text-dim);letter-spacing:.04em;text-transform:uppercase}
:root[data-vibe="terminal"] .card-title{color:var(--accent)}
.card-action{font-size:11px;color:var(--text-dim);cursor:pointer}
.card-action:hover{color:var(--text)}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--pad)}
.kpi{background:var(--card-bg);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
:root[data-vibe="terminal"] .kpi{padding:10px 12px}
.kpi-label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--text-dim);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-label svg{width:12px;height:12px;opacity:.7}
.kpi-value{font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;font-family:var(--font-display);line-height:1.1}
:root[data-vibe="terminal"] .kpi-value{font-size:22px;font-weight:700}
.kpi-foot{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:2px}
.kpi-delta{display:inline-flex;align-items:center;gap:3px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi-delta.pos{color:var(--pos)}.kpi-delta.neg{color:var(--neg)}
.kpi-delta svg{width:11px;height:11px}
.kpi-sub{color:var(--text-faint);font-size:11px}
.kpi-spark{position:absolute;right:8px;bottom:8px;width:80px;height:28px;opacity:.85;pointer-events:none}
.grid-2{display:grid;grid-template-columns:2fr 1fr;gap:var(--pad)}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--pad)}
.grid-equity{display:grid;grid-template-columns:1fr 320px;gap:var(--pad)}
.grid-bottom{display:grid;grid-template-columns:1.4fr 1fr;gap:var(--pad)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase;background:var(--bg-elev2);color:var(--text-dim);border:1px solid var(--line)}
:root[data-vibe="terminal"] .tag{border-radius:0}
.tag.long{color:var(--pos);border-color:color-mix(in oklab,var(--pos) 35%,transparent);background:color-mix(in oklab,var(--pos) 10%,transparent)}
.tag.short{color:var(--neg);border-color:color-mix(in oklab,var(--neg) 35%,transparent);background:color-mix(in oklab,var(--neg) 10%,transparent)}
.tag.live{color:var(--accent)}
.tag.live::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse-dot 1.4s ease-out infinite;display:inline-block;flex-shrink:0}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}
.seg{display:inline-flex;background:var(--bg-elev2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:2px}
:root[data-vibe="terminal"] .seg{border-radius:0;padding:0}
.seg button{appearance:none;border:0;background:transparent;color:var(--text-dim);padding:4px 10px;font:inherit;font-size:11px;font-weight:500;border-radius:4px;cursor:pointer;font-variant-numeric:tabular-nums}
:root[data-vibe="terminal"] .seg button{border-radius:0;padding:4px 8px;text-transform:uppercase}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--bg);color:var(--text);box-shadow:0 1px 0 var(--line)}
:root[data-vibe="terminal"] .seg button.on{background:transparent;color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:10px;font-weight:600;color:var(--text-faint);letter-spacing:.05em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card-bg);z-index:1}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--text)}
.tbl tbody tr{cursor:pointer;transition:background .08s}
.tbl tbody tr:hover{background:var(--bg-elev2)}
.tbl tbody tr.selected{background:color-mix(in oklab,var(--accent) 8%,transparent)}
.tbl td.num{font-family:var(--font-mono);font-feature-settings:'tnum';text-align:right}
.tbl td.pos{color:var(--pos)}.tbl td.neg{color:var(--neg)}.tbl td.mono{font-family:var(--font-mono)}
.chart-wrap{position:relative;width:100%}
.chart-svg{display:block;width:100%}
.chart-grid line{stroke:var(--grid);stroke-width:1}
.chart-axis text{fill:var(--text-faint);font-size:10px;font-family:var(--font-mono)}
.chart-tooltip{position:absolute;pointer-events:none;background:var(--bg-elev);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:8px 10px;font-size:11px;font-family:var(--font-mono);color:var(--text);white-space:nowrap;z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.3);transform:translate(-50%,calc(-100% - 8px))}
.chart-tooltip strong{color:var(--text);font-weight:600}
.chart-tooltip .row{display:flex;justify-content:space-between;gap:12px}
.chart-tooltip .row span:first-child{color:var(--text-dim)}
:root[data-vibe="terminal"] .chart-tooltip{border-radius:0}
.heatmap{display:flex;flex-direction:column;gap:6px}
.heatmap-cell{aspect-ratio:1;border-radius:2px;cursor:pointer;background:var(--bg-elev2);transition:transform .08s;position:relative}
.heatmap-cell:hover{transform:scale(1.4);z-index:2;outline:1px solid var(--text)}
.heatmap-legend{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--text-faint);justify-content:flex-end}
.heatmap-legend .swatches{display:inline-flex;gap:2px}
.heatmap-legend .swatch{width:11px;height:11px;border-radius:2px}
.feed{display:flex;flex-direction:column}
.feed-item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.feed-item:last-child{border-bottom:0}
.feed-icon{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--bg-elev2);color:var(--text-dim);flex-shrink:0}
.feed-icon svg{width:12px;height:12px}
.feed-icon.pos{background:color-mix(in oklab,var(--pos) 14%,transparent);color:var(--pos)}
.feed-icon.neg{background:color-mix(in oklab,var(--neg) 14%,transparent);color:var(--neg)}
.feed-icon.acc{background:color-mix(in oklab,var(--accent) 14%,transparent);color:var(--accent)}
.feed-icon.warn{background:color-mix(in oklab,var(--warn) 14%,transparent);color:var(--warn)}
.feed-text{font-size:12.5px;color:var(--text);line-height:1.4}
.feed-sub{font-size:11px;color:var(--text-faint);margin-top:1px;font-family:var(--font-mono)}
.feed-time{font-size:11px;color:var(--text-faint);font-family:var(--font-mono);white-space:nowrap}
.row{display:flex;align-items:center;gap:8px}.col{display:flex;flex-direction:column}
.spacer{flex:1}.dim{color:var(--text-dim)}.faint{color:var(--text-faint)}.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}.num{font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--bg-elev2);border-radius:999px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);transition:width .4s ease}
:root[data-vibe="terminal"] .bar{border-radius:0}
.drilldown{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:100vw;background:var(--panel);border-left:1px solid var(--line-strong);box-shadow:-8px 0 28px rgba(0,0,0,.3);z-index:100;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s cubic-bezier(.3,.7,.4,1)}
.drilldown.open{transform:translateX(0)}
.drilldown-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.drilldown-body{padding:18px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.dd-row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.dd-row:last-child{border-bottom:0}
.dd-row span:first-child{color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.dd-row span:last-child{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:13px}
.dd-close{appearance:none;border:0;background:var(--bg-elev2);color:var(--text);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:16px;line-height:1;display:grid;place-items:center}
.dd-close:hover{background:var(--bg)}
.drilldown-scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
.drilldown-scrim.open{opacity:1;pointer-events:auto}
.strategy-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:0}
.strategy-tab{appearance:none;border:0;background:transparent;color:var(--text-dim);padding:10px 16px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.strategy-tab:hover{color:var(--text)}
.strategy-tab.on{color:var(--text);border-bottom-color:var(--accent)}
.strategy-tab .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.bot-row:hover{background:var(--bg-elev2);border-radius:6px}
.main::-webkit-scrollbar{width:10px}
.main::-webkit-scrollbar-track{background:transparent}
.main::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:5px;border:2px solid var(--bg);background-clip:content-box}
.main::-webkit-scrollbar-thumb:hover{background:var(--text-faint);background-clip:content-box;border:2px solid var(--bg)}
.pulse-now{width:6px;height:6px;border-radius:50%;background:var(--pos);display:inline-block;position:relative;margin-right:6px}
.pulse-now::after{content:'';position:absolute;inset:-3px;border-radius:50%;background:var(--pos);animation:pulse 1.6s ease-out infinite;opacity:.4}
/* System Health */
.circuit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.circuit-card{background:var(--bg-elev2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.circuit-card.open{border-color:color-mix(in oklab,var(--neg) 40%,transparent);background:color-mix(in oklab,var(--neg) 5%,transparent)}
.circuit-card.closed{border-color:color-mix(in oklab,var(--pos) 40%,transparent)}
/* Logs */
.log-list{display:flex;flex-direction:column;gap:0;max-height:480px;overflow-y:auto;font-family:var(--font-mono);font-size:11px}
.log-entry{display:grid;grid-template-columns:90px 140px 1fr;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);line-height:1.4}
.log-entry:hover{background:var(--bg-elev2)}
.log-entry.type-error{background:color-mix(in oklab,var(--neg) 5%,transparent)}
.log-entry.type-pos{color:var(--pos)}
.log-entry.type-neg{color:var(--neg)}
.log-entry.type-acc{color:var(--accent)}
.log-stream{color:var(--text-faint);font-size:10px}
/* Tweaks */
.tweaks-toggle{position:fixed;bottom:20px;right:20px;z-index:200;background:var(--bg-elev);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:8px 14px;color:var(--text-dim);font:inherit;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.tweaks-toggle:hover{background:var(--bg-elev2);color:var(--text)}
.tweaks-toggle svg{width:14px;height:14px}
.tweaks-panel{position:fixed;bottom:60px;right:20px;z-index:201;background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--radius);padding:16px;width:280px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:14px}
.tweak-section{display:flex;flex-direction:column;gap:8px}
.tweak-section-label{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint)}
.tweak-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
.tweak-row label{color:var(--text-dim)}
.tweak-row select{background:var(--bg-elev2);border:1px solid var(--line);border-radius:4px;color:var(--text);font:inherit;font-size:11px;padding:3px 6px;cursor:pointer}
.accent-dots{display:flex;gap:6px;flex-wrap:wrap}
.accent-dot{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .1s}
.accent-dot.active{border-color:var(--text)}
.ws-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-family:var(--font-mono);padding:2px 8px;border-radius:999px;background:var(--bg-elev2);border:1px solid var(--line)}
.ws-badge.on{color:var(--pos)}
.ws-badge.off{color:var(--neg)}
.ws-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
@media(max-width:1180px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.grid-equity{grid-template-columns:1fr}.grid-bottom{grid-template-columns:1fr}.grid-3{grid-template-columns:1fr}}
@media(max-width:760px){:root{--sidebar-w:64px}.sb-brand-name,.sb-brand-sub,.sb-section-label,.sb-item span,.sb-item-badge,.sb-foot{display:none}.sb-item{justify-content:center}.drilldown{width:100vw}}
/* ── Decision Trace ──────────────────────────────────────────────────────── */
.dt-root{display:flex;flex-direction:column;gap:0}
.dt-header{display:flex;gap:20px;flex-wrap:wrap;padding:10px 0 14px;border-bottom:1px solid var(--line)}
.dt-header-stat .val{font-size:24px;font-weight:700;font-family:var(--font-mono);font-variant-numeric:tabular-nums;line-height:1}
.dt-header-stat .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-top:1px}
.dt-filterbar{display:flex;align-items:center;gap:8px;padding:10px 0;flex-wrap:wrap}
.dt-filterbar input{background:var(--bg-elev2);border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--text);font:inherit;font-size:11px;padding:5px 9px;min-width:200px;flex:1}
.dt-filterbar select{background:var(--bg-elev2);border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--text);font:inherit;font-size:11px;padding:5px 9px;cursor:pointer}
.dt-split{display:grid;grid-template-columns:minmax(320px,400px) 1fr;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-height:500px}
.dt-list{overflow-y:auto;border-right:1px solid var(--line);background:var(--panel);max-height:calc(100vh - 280px)}
.dt-row{display:grid;grid-template-columns:4px 1fr auto;gap:0;cursor:pointer;border-bottom:1px solid var(--line);transition:background .08s}
.dt-row:hover{background:var(--bg-elev2)}.dt-row.sel{background:color-mix(in oklab,var(--accent) 8%,transparent)}
.dt-row-bar{width:4px;min-height:60px}.dt-row-bar.EXECUTED{background:var(--pos)}.dt-row-bar.REJECTED{background:var(--neg)}.dt-row-bar.PENDING{background:var(--warn)}
.dt-row-body{padding:10px 12px;min-width:0}
.dt-row-dur{padding:10px 10px 10px 0;font-family:var(--font-mono);font-size:10px;color:var(--text-faint);white-space:nowrap;align-self:center}
.dt-trace{overflow-y:auto;background:var(--bg-elev);padding:18px;max-height:calc(100vh - 280px)}
.dt-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.dt-meta-cell{background:var(--bg-elev2);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.dt-timeline{display:flex;flex-direction:column}
.dt-evt{display:grid;grid-template-columns:80px 16px 1fr;gap:8px;padding:8px 0;align-items:flex-start;font-size:11px;border-bottom:1px solid var(--line)}
.dt-evt:last-child{border-bottom:0}
.dt-evt-dot{width:8px;height:8px;border-radius:50%;background:var(--text-faint);margin-top:3px;flex-shrink:0}
.dt-evt-dot.pos{background:var(--pos)}.dt-evt-dot.neg{background:var(--neg)}.dt-evt-dot.acc{background:var(--accent)}.dt-evt-dot.warn{background:var(--warn)}
.dt-pill{display:inline-flex;align-items:center;font-size:9px;font-weight:700;padding:1px 6px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.dt-pill.EXECUTED{color:var(--pos);background:color-mix(in oklab,var(--pos) 14%,transparent)}
.dt-pill.REJECTED{color:var(--neg);background:color-mix(in oklab,var(--neg) 14%,transparent)}
.dt-pill.PENDING{color:var(--warn);background:color-mix(in oklab,var(--warn) 14%,transparent)}
.dt-empty{display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--text-faint);font-size:13px;text-align:center;padding:32px}
/* ── Event Stream ────────────────────────────────────────────────────────── */
.es-event-list{max-height:calc(100vh - 260px);overflow-y:auto;display:flex;flex-direction:column}
.es-evt{display:grid;grid-template-columns:80px 60px 150px 1fr 100px;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .08s;font-size:11px;font-family:var(--font-mono);align-items:baseline}
.es-evt:hover,.es-evt.expanded{background:var(--bg-elev2)}
.es-detail{padding:8px 12px 10px;background:var(--bg-elev2);border-bottom:1px solid var(--line-strong);font-family:var(--font-mono);font-size:10px;color:var(--text-dim);white-space:pre-wrap;word-break:break-all;max-height:180px;overflow-y:auto}
.lv-badge{display:inline-flex;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:.03em;font-family:var(--font-mono)}
.lv-badge.error{color:var(--neg);background:color-mix(in oklab,var(--neg) 14%,transparent)}
.lv-badge.warn{color:var(--warn);background:color-mix(in oklab,var(--warn) 14%,transparent)}
.lv-badge.info{color:var(--accent);background:color-mix(in oklab,var(--accent) 10%,transparent)}
.lv-badge.debug{color:var(--text-faint);background:var(--bg-elev2);border:1px solid var(--line)}

.sh-gauge-fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;transition:width .5s ease}
.sh-res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.sh-res-card{background:var(--bg-elev2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px}
.sh-eb-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);align-items:center;font-size:12px}

.sh-svc-table td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px}
.sh-svc-table td:not(:first-child){text-align:right;font-family:var(--font-mono)}
.sh-svc-table tbody tr:hover{background:var(--bg-elev2)}

.rp-outcome{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.rp-outcome.win{background:var(--pos)}.rp-outcome.loss{background:var(--neg)}.rp-outcome.unknown{background:var(--text-faint)}
.rp-timeline{display:flex;flex-direction:column;gap:0}

.rp-stage-type{font-family:var(--font-mono);font-size:10px;color:var(--accent)}
.rp-delta{font-family:var(--font-mono);color:var(--text-faint);font-size:11px}
.rp-empty{display:grid;place-items:center;height:200px;color:var(--text-faint);font-size:12px}

.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}

.sc-status{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}

.pf-stat:last-child{border-bottom:0}
